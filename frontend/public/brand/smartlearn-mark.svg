<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Indigo to Violet Gradient for Mark Paths -->
    <linearGradient id="sl-freestanding-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B46D8" />
      <stop offset="50%" stop-color="#7367E8" />
      <stop offset="100%" stop-color="#8B7FFF" />
    </linearGradient>
    <linearGradient id="sl-cap-highlight" x1="12" y1="6" x2="36" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7367E8" />
      <stop offset="100%" stop-color="#5B46D8" />
    </linearGradient>
  </defs>
  
  <!-- Freestanding Graduation Cap Silhouette Top -->
  <path d="M24 4L42 13L24 22L6 13L24 4Z" fill="url(#sl-freestanding-grad)" />
  <path d="M12 17.5V25C12 28.5 17.3 31 24 31C30.7 31 36 28.5 36 25V17.5" stroke="url(#sl-freestanding-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Tassel & Hanging Node -->
