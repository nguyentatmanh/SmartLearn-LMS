  <!-- Circuit Nodes & Node Connector Dots -->
  <circle cx="12" cy="27" r="2.5" fill="#5B46D8" />
  <circle cx="34" cy="37.5" r="2.5" fill="#8B7FFF" />
  <line x1="14.5" y1="27" x2="16" y2="27" stroke="#5B46D8" stroke-width="2" />
  <line x1="30" y1="37.5" x2="31.5" y2="37.5" stroke="#8B7FFF" stroke-width="2" />
